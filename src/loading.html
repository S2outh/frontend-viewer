<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1.5rem auto;
      border: 4px solid #374151;
      border-top-color: #f9fafb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    p {
      margin: 0;
      color: #d1d5db;
      line-height: 1.5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <p>Connecting…</p>
  </main>
</body>
</html>
